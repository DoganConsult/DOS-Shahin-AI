name: Audit Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full audit
        run: pnpm audit:full
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: reports/audit/*.json
          retention-days: 30

      - name: Create PR on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow,
              per_page: 1
            });
            
            const run = runs.workflow_runs[0];
            const reportDate = new Date().toISOString().split('T')[0];
            
            // Check if PR already exists for today
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `audit-failure-${reportDate}`
            });
            
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Audit Failure - ${reportDate}`,
                head: `audit-failure-${reportDate}`,
                base: 'main',
                body: `Nightly audit failed on ${reportDate}. Please review the audit report artifact and fix the issues.`,
                labels: ['audit', 'failure']
              });
            }
