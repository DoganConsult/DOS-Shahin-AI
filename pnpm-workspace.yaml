packages:
  # Platform DNA
  - 'platform/foundation'
  - 'platform/access/*'
  - 'platform/ui-system/*'
  - 'platform/workflow'
  - 'platform/workflow/packages/*'
  - 'platform/dauth/packages/*'
  - 'platform/dauth/services/*'
  - 'platform/dos/packages/*'
  - 'platform/dos/services/*'
  - 'platform/dsoc/packages/*'
  - 'platform/dsoc/services/*'
  - 'platform/dnoc/packages/*'
  - 'platform/dnoc/services/*'
  - 'platform/ai/packages/*'
  - 'platform/ai/services/*'
  - 'platform/ai/admin/services/*'
  - 'platform/config-center/test'
  # Microservices
  - 'services/*'
  # Modules + shared workspace packages
  - 'modules/packages/*'
  - 'modules/qiyas'
  - 'modules/compliance'
  - 'modules/compliance/sdk/typescript'
  # Platform App (single SPA entry point for all products)
  - 'platform/app'
  # NOTE: legacy 'products/shahin-ai/app/src/app' workspace entry retired
  # 2026-05-05 — directory deleted from disk; products/ is composition-only
  # (BE/manifest/jobs only, enforced by scripts/ci-guards/product-no-runtime.mjs).
  # ── Foundation Console (standalone product, plug-and-play) ──────────
  # Auth + DB shared with host platform; everything else is product-owned.
  # See products/foundation-console/product.manifest.json.
  - 'products/foundation-console/packages/*'
  - 'products/foundation-console/services/*'
  - 'products/foundation-console/app'
ignoredBuiltDependencies: []
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
  - better-sqlite3
  - bcrypt
  - sharp
