components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        DAuth-issued JWT with `tenant_id` + `sub` (user) + `permissions[]` claims.
        Issued by Keycloak (realm `dogan`); verified by every host service.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor for pagination (keyset).
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [bad_input, not_found, forbidden, unauthorized, conflict, internal]
            message:
              type: string
            details:
              type: object
              description: Field-level validation errors when code=bad_input
            request_id:
              type: string
              description: Echoed for support correlation

    PagedListEnvelope:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { type: object }
        page:
          type: object
          properties:
            cursor: { type: string, nullable: true }
            nextCursor: { type: string, nullable: true }
            limit: { type: integer }
            total: { type: integer, nullable: true }

    Control:
      type: object
      required: [id, code, name, frameworkId, status, tenantId]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, readOnly: true }
        code: { type: string, examples: [AC-2, NCA-2-1-1, SAMA-CS-2.1.1] }
        name: { type: string }
        description: { type: string }
        frameworkId: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, active, deprecated, archived]
        owner: { type: string, format: uuid, nullable: true }
        effectiveness:
          type: string
          enum: [not_tested, effective, partially_effective, ineffective, na]
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    Framework:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [ISO27001, SOC2, NIST_CSF_2, NCA_ECC, SAMA_CSF, PDPL] }
        name: { type: string }
        version: { type: string, examples: ['2022', '2.0', 'v1.0'] }
        description: { type: string }
        applicableSectors:
          type: array
          items: { type: string }
        controlCount: { type: integer }

    Attestation:
      type: object
      required: [id, campaignId, controlId, attestorId, status]
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        controlId: { type: string, format: uuid }
        attestorId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, in_progress, attested, declined, escalated, expired]
        evidence:
          type: array
          items: { type: object }
        signedAt: { type: string, format: date-time, nullable: true }
        signature:
          type: string
          nullable: true
          description: Cryptographic signature when CMEK enabled (Wave 11+)

  requestBodies:
    ControlCreate:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Control'
              - required: [code, name, frameworkId]

    ControlUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Control'

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Permission denied (RBAC + ownership check)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found in current tenant scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadInput:
      description: Validation failed (Zod schema)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource already exists or version conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    HealthOk:
      description: Module liveness + DB connectivity OK
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, examples: [true] }
              service: { type: string, examples: [compliance] }
              checks:
                type: object
                properties:
                  schema_exists: { type: boolean }
                  tables_exist: { type: boolean }
                  permissions_catalog_valid: { type: boolean }
    HealthDegraded:
      description: Module unavailable (DB connection / migrations missing)
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, examples: [false] }
              error: { type: string }
    OverviewResponse:
      description: Compliance posture summary
      content:
        application/json:
          schema:
            type: object
            properties:
              postureScore: { type: number }
              frameworksTracked: { type: integer }
              controlsTotal: { type: integer }
              controlsEffective: { type: integer }
              gapsOpen: { type: integer }
              attestationsPending: { type: integer }
              recentActivity: { type: array, items: { type: object } }
    PagedList:
      description: Cursor-paginated list
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PagedListEnvelope' }
    Control:
      description: Control resource
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Control' }
    Framework:
      description: Framework resource
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Framework' }
    Attestation:
      description: Attestation resource
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Attestation' }
