openapi: 3.1.0
info:
  title: DOS Compliance Module API
  description: |
    Compliance module HTTP API. Co-hosted by `governance-policy-service` via
    `@dos/module-compliance.registerCompliance()`. All routes are tenant-scoped
    via the JWT `tenant_id` claim and enforce per-resource permissions.

    Owns 9 tenant-scoped tables (`frameworks`, `controls`, `compliance_mappings`,
    `compliance_assessments`, `compliance_gaps`, `compliance_requirements`,
    `control_objectives`, `control_testing`, `control_evidence_links`),
    publishes 13 events, subscribes to 8.

    This spec covers the route surface declared in `module.manifest.json`
    `routeBases[]`. Per-endpoint Zod request/response schemas are added in
    Wave 2 (schema-validation sweep); per-endpoint detail is finalized for
    public publication in Wave 19.
  version: 1.0.0
  contact:
    name: product-shahin-ai
    email: compliance-eng@dos-aio.com
  license:
    name: Proprietary
    identifier: LicenseRef-DOS-AIO-Proprietary
servers:
  - url: https://shahin-ai.com
    description: Production
  - url: https://staging.shahin-ai.com
    description: Staging
  - url: http://localhost:4000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: overview
    description: Compliance posture, dashboards, workspace
  - name: controls
    description: Control library, testing, lifecycle, mapping
  - name: frameworks
    description: Framework registry, cross-mapping, UCF
  - name: assessments
    description: Compliance assessments, RCSA, templates
  - name: attestations
    description: Attestation campaigns, drafts, records
  - name: obligations
    description: Regulatory obligations, requirements
  - name: ksa-regulatory
    description: Saudi Arabia regulator-specific (NCA, SAMA, PDPL, ECC)
  - name: scoring
    description: Maturity scoring, posture calculation
  - name: lifecycle
    description: Control lifecycle, state machines
  - name: admin
    description: Configuration, runtime settings, diagnostics
  - name: realtime
    description: WebSocket / SSE real-time channels
  - name: ai
    description: AI-driven suggestions, recommendations, analysis (Phase D)
  - name: introspection
    description: Module discovery, mounts, health

paths:
  ###########################################################################
  # /api/regulator/* — Regulator readiness surfaces (added 2026-05-02 wave 1).
  # Wired directly in bootstrap.ts routers map; canonical handlers live in
  # interface/http/regulator/*.routes.ts.
  ###########################################################################
  /api/regulator/heatmap:
    get:
      tags: [overview]
      summary: Regulator readiness heatmap (per-jurisdiction × per-framework score grid)
      responses:
        '200':
          description: Array of regulator/framework readiness rows
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/regulator/portal:
    get:
      tags: [overview]
      summary: Regulator portal entry — list of organisations + open regulator inquiries
      responses:
        '200':
          description: Regulator-facing organisation list
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/regulator/registry:
    get:
      x-zod-schemas:
        query: z.record
      tags: [overview]
      summary: Regulator registry — list of registered regulators with metadata
      responses:
        '200':
          description: Array of regulator records
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  ###########################################################################
  # /api/compliance — Aggregator + composite
  ###########################################################################
  /api/compliance:
    get:
      x-zod-schemas:
        query: listQuerySchema
      tags: [overview]
      summary: Compliance overview / dashboard composite
      description: Returns posture summary, KPIs, top gaps, recent activity.
      responses:
        '200': { $ref: '#/components/responses/OverviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/compliance/__compliance/mounts:
    get:
      tags: [introspection]
      summary: List mounted route bases (debug / discovery)
      responses:
        '200':
          description: Array of mounted prefixes with wired flags
  /api/compliance/health:
    get:
      tags: [introspection]
      summary: Liveness + DB connectivity check
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/HealthDegraded' }

  /api/compliance-ws:
    get:
      tags: [realtime]
      summary: WebSocket endpoint for compliance event stream
      description: |
        Upgrade request. Subscribes to compliance events for the authenticated tenant:
        gap_detected, gap_closed, posture_changed, attestation_recorded, etc.
      responses:
        '101': { description: Switching Protocols (WebSocket upgrade) }

  ###########################################################################
  # /api/controls — Control library
  ###########################################################################
  /api/controls:
    get:
      tags: [controls]
      summary: List controls
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: frameworkId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, deprecated, archived] }
      responses:
        '200': { $ref: '#/components/responses/PagedList' }
    post:
      tags: [controls]
      summary: Create a new control
      requestBody: { $ref: '#/components/requestBodies/ControlCreate' }
      responses:
        '201': { $ref: '#/components/responses/Control' }
        '400': { $ref: '#/components/responses/BadInput' }
  /api/controls/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [controls]
      summary: Read control by id
      responses:
        '200': { $ref: '#/components/responses/Control' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [controls]
      summary: Update control fields
      requestBody: { $ref: '#/components/requestBodies/ControlUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Control' }
    delete:
      tags: [controls]
      summary: Soft-delete control
      responses:
        '204': { description: Deleted }

  /api/control:
    get:
      x-zod-schemas:
        query: listQuerySchema
      tags: [controls]
      summary: Singular alias / control detail endpoints (legacy compatibility)
      responses:
        '200': { description: OK }

  /api/compliance-controls:
    get:
      tags: [controls]
      summary: Controls under compliance namespace (legacy alias)
      responses:
        '200': { $ref: '#/components/responses/PagedList' }

  ###########################################################################
  # /api/frameworks — Framework registry
  ###########################################################################
  /api/frameworks:
    get:
      x-zod-schemas:
        query: z.record
      tags: [frameworks]
      summary: List frameworks (ISO 27001, SOC 2, NIST CSF, NCA ECC, SAMA, PDPL, GDPR, HIPAA, PCI-DSS, ...)
      responses:
        '200': { $ref: '#/components/responses/PagedList' }
    post:
      tags: [frameworks]
      summary: Register a custom framework
      responses:
        '201': { $ref: '#/components/responses/Framework' }

  /api/frameworks/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [frameworks]
      responses: { '200': { $ref: '#/components/responses/Framework' } }

  /api/framework-mapping:
    get:
      tags: [frameworks]
      summary: Cross-framework mapping registry
      responses: { '200': { $ref: '#/components/responses/PagedList' } }

  /api/mappings:
    get:
      tags: [frameworks]
      summary: Compliance mapping records (control ↔ framework requirement)
      responses: { '200': { $ref: '#/components/responses/PagedList' } }

  /api/ucf:
    get:
      tags: [frameworks]
      summary: Unified Compliance Framework cross-mapping
      responses: { '200': { $ref: '#/components/responses/PagedList' } }

  ###########################################################################
  # /api/compliance-attestation, /api/compliance-assertions
  ###########################################################################
  /api/compliance-attestation:
    get:
      tags: [attestations]
      summary: Attestation campaigns
      responses: { '200': { $ref: '#/components/responses/PagedList' } }
    post:
      tags: [attestations]
      summary: Start attestation campaign
      responses:
        '201': { $ref: '#/components/responses/Attestation' }
  /api/compliance-attestation/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [attestations]
      responses: { '200': { $ref: '#/components/responses/Attestation' } }
    patch:
      tags: [attestations]
      summary: Update attestation status / sign attestation
      responses: { '200': { $ref: '#/components/responses/Attestation' } }

  /api/compliance-assertions:
    get:
      x-zod-schemas:
        query: z.record
      tags: [overview]
      summary: Compliance posture assertions / posture composite
      responses: { '200': { description: Posture composite } }

  ###########################################################################
  # /api/compliance-obligations
  ###########################################################################
  /api/compliance-obligations:
    get:
      tags: [obligations]
      summary: Regulatory obligations + requirements
      responses: { '200': { $ref: '#/components/responses/PagedList' } }

  ###########################################################################
  # /api/objects — Compliance object registry
  ###########################################################################
  /api/objects:
    get:
      tags: [admin]
      summary: Compliance object registry (exceptions, compensating controls, etc.)
      responses: { '200': { $ref: '#/components/responses/PagedList' } }

  ###########################################################################
  # /api/scoring-policies, /api/lifecycle
  ###########################################################################
  /api/scoring-policies:
    get:
      tags: [scoring]
      summary: Scoring policies + weighting configuration
      responses: { '200': { $ref: '#/components/responses/PagedList' } }
    post:
      tags: [scoring]
      summary: Create scoring policy
      responses: { '201': { description: Created } }

  /api/lifecycle:
    get:
      tags: [lifecycle]
      summary: Control lifecycle state-machine inspection
      responses: { '200': { description: Lifecycle states } }

  ###########################################################################
  # /api/assessments, /api/rcsa, /api/assessment-templates
  ###########################################################################
  /api/assessments:
    get:
      tags: [assessments]
      summary: List compliance assessments
      responses: { '200': { $ref: '#/components/responses/PagedList' } }
    post:
      tags: [assessments]
      responses: { '201': { description: Created } }
  /api/assessments/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [assessments]
      responses: { '200': { description: OK } }
    patch:
      tags: [assessments]
      summary: Update assessment / submit responses
      responses: { '200': { description: Updated } }

  /api/rcsa:
    get:
      tags: [assessments]
      summary: Risk Control Self-Assessment campaigns
      responses: { '200': { $ref: '#/components/responses/PagedList' } }

  /api/assessment-templates:
    get:
      x-zod-schemas:
        query: listQuery
      tags: [assessments]
      summary: Assessment template library
      responses: { '200': { $ref: '#/components/responses/PagedList' } }

