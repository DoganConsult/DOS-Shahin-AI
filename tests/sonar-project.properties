sonar.projectKey=dos-aio-platform
sonar.projectName=DOS-AIO Platform
sonar.projectVersion=1.0.0

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/coverage/**,**/*.d.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

sonar.coverage.jacoco.xmlReportsPaths=coverage/lcov.xml,coverage/cobertura-coverage.xml
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/migrations/**,**/seed/**,**/test-setup.ts

sonar.issuesReport.html.enable=true
sonar.issuesReport.console.enable=true

sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**

sonar.code_smells_minimum_threshold=0
sonar.vulnerabilities_minimum_threshold=0
sonar.security_hotspots_minimum_threshold=0

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

sonar.organization=doshahin
sonar.token=${SONAR_TOKEN}

sonar.python.version=3.11
sonar.javascript.node.maxspace=4096

sonar.typescript.linting.enabled=true
sonar.typescript.rules管理体制=typescript:S3854,typescript:S1871,typescript:S1862

sonar.cognitiveComplexity.enabled=true
sonar.cognitiveComplexity.threshold=15

sonar.telemetry.enable=false
