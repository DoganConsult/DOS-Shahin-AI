# Foundation Console — nginx reverse proxy.
# Single edge entry point. SSO callback + Angular static + API reverse proxy.

upstream fc_gateway     { server 127.0.0.1:3000; }
upstream fc_ui_os       { server 127.0.0.1:3101; }
upstream fc_dynamic_ui  { server 127.0.0.1:3102; }

server {
    listen 80;
    server_name foundation.console.local;

    # Hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Runtime config + auth callbacks → gateway
    location = /config.json   { proxy_pass http://fc_gateway; }
    location = /healthz       { proxy_pass http://fc_gateway; }
    location = /readyz        { proxy_pass http://fc_gateway; }
    location /auth/           { proxy_pass http://fc_gateway; }

    # API surface (everything under /api/* served by gateway, which fans out internally)
    location /api/ {
        proxy_pass http://fc_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Angular static (built dist served from disk)
    root /opt/foundation-console/app/dist/foundation-console/browser;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
