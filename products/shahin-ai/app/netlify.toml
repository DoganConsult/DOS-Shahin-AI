[build]
  command = "npm run build"
  publish = "dist/shahin-grc/browser"

# Font files — correct MIME type, CORS, no CDN transform
[[headers]]
  for = "/media/*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable, no-transform"
    CDN-Cache-Control = "no-transform"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/media/*.woff"
  [headers.values]
    Content-Type = "font/woff"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable, no-transform"
    CDN-Cache-Control = "no-transform"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/media/*.ttf"
  [headers.values]
    Content-Type = "font/ttf"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable, no-transform"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/media/*.eot"
  [headers.values]
    Content-Type = "application/vnd.ms-fontobject"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable, no-transform"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
