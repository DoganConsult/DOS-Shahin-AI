parent=keycloak
import=common/keycloak

styles=css/login.css css/dogan.css

locales=en,ar

kcLogoLink=https://shahin-ai.com
kcLogoIdP-dogan=fa fa-shield-halved

# Brand identity
brandName=Shahin
brandTitle=Shahin — Dogan GRC Platform
brandLogo=img/dogan-logo.svg
brandFavicon=img/favicon.svg

# Layout
displayInfo=true
displayWide=false

# Override the default Keycloak login template variables that the parent
# theme reads when rendering the page chrome.
properties.kcHtmlClass=login-pf dogan
properties.kcLoginClass=login-pf-page dogan
properties.kcContentWrapperClass=login-pf-page-content dogan
properties.kcFormCardClass=card-pf dogan-card
properties.kcFormHeaderClass=login-pf-header dogan-header
properties.kcFormSocialAccountListClass=login-pf-social list-unstyled login-pf-social-section
