global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - alerts.yml
  - rules/slo.yml

# Targets are generated from the same PM2 ecosystem as nginx:
#   pnpm run generate:edge-config
# File: ops/monitoring/generated/ecosystem-file-sd.json
# Run Prometheus with working directory ops/monitoring (see ops/monitoring/README.md).
scrape_configs:
  - job_name: dos-ecosystem
    metrics_path: /metrics
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - generated/ecosystem-file-sd.json
        refresh_interval: 30s

  # ClickHouse native prometheus endpoint.
  # Requires <prometheus><endpoint>/metrics</endpoint><port>9363</port></prometheus>
  # in /etc/clickhouse-server/config.d/prometheus.xml. Scraped here so the
  # dos_clickhouse_up / buffer-depth alerts in alerts.yml have a server-side
  # counterpart (ch_system_*, ch_asynchronous_metrics_*).
  - job_name: clickhouse
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9363']
        labels:
          component: clickhouse
          service: clickhouse-server
