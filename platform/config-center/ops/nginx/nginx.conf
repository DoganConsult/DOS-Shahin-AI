# DOS Platform — Base NGINX configuration
# Deployed to /etc/nginx/nginx.conf on all platform servers.
# Canonical source: ops/nginx/nginx.conf
#
# IMPORTANT: Keep this file synchronized with /etc/nginx/nginx.conf on all servers.
# Run: sudo cp ops/nginx/nginx.conf /etc/nginx/nginx.conf && sudo nginx -t && sudo nginx -s reload
#
# Changes to this file should go through the standard PR → staging → production
# deployment pipeline. Do NOT edit /etc/nginx/nginx.conf directly on servers.

user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── TLS: TLSv1.2 and TLSv1.3 only — TLSv1/TLSv1.1 are deprecated ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Logging ───────────────────────────────────────────────────────────
    # Log files must be writable by www-data. If you see "permission denied" errors,
    # run: sudo chown -R www-data:www-data /var/log/nginx/
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;

    # ── SPA + API (site snippets) ───────────────────────────────────────────
    # For Shahin-AI / DOS frontends: `location /api/` must proxy to the API gateway so
    # `/api/session/bootstrap`, `/api/auth/oidc/*`, and cookie-backed `/api/auth/oidc/session`
    # work from the same browser origin as the SPA (preserve `Host` / TLS for cookie scope).

    # ── Virtual Host Configs ───────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
