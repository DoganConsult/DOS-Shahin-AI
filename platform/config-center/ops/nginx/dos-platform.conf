# DOS Platform — nginx (clean shell, post-transformation).
#
# Same-domain /login Keycloak topology. Only the four shell processes
# are routed; module hosts will be added back per-module after each
# module is rebuilt.
#
# Processes:
#   gateway          127.0.0.1:4000
#   auth-service     127.0.0.1:4001   (DAuth — internal only, all traffic via gateway)
#   tenant-service   127.0.0.1:4002   (internal only, via gateway)
#   product-shell    127.0.0.1:3000   (SPA + /api/* proxy to gateway)
#   keycloak         127.0.0.1:8180   (mounted under /login)
#
# Public flow:
#   Browser → :443 → nginx
#     /                       → product_shell (Angular SPA fallback)
#     /api/auth/oidc/start    → product_shell → gateway → auth-service
#     /api/auth/oidc/callback → product_shell → gateway → auth-service → 302 /workspace-home
#     /api/*                  → product_shell → gateway
#     /login/                 → keycloak (KC_HTTP_RELATIVE_PATH=/login)

# ── Rate-limit zones ──
limit_req_zone $binary_remote_addr zone=api_global:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict:5m  rate=120r/m;
limit_req_zone $binary_remote_addr zone=static_zone:5m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

client_max_body_size 10m;
limit_req_status  429;
limit_conn_status 429;

# ── Global security headers ──
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options          "SAMEORIGIN" always;
add_header X-XSS-Protection         "1; mode=block" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

# ── Upstreams (only the four shell processes + keycloak) ──
upstream platform_gateway { server 127.0.0.1:4000; }
upstream product_shell    { server 127.0.0.1:3000; }
upstream keycloak_origin  { server 127.0.0.1:8180; }

# ── Legacy hosts → 301 to canonical apex ──
server {
    listen 80;
    server_name
        auth.shahin-ai.com   auth.dogan-ai.com
        admin.dogan-ai.com   dogan-ai.com    www.dogan-ai.com
        app.shahin-ai.com;
    return 301 https://shahin-ai.com$request_uri;
}

# ── Canonical product host ──
server {
    listen 80;
    server_name shahin-ai.com www.shahin-ai.com;
    limit_conn  conn_per_ip 50;

    # Keycloak under /login (same-domain factory reset).
    # KC must run with KC_HTTP_RELATIVE_PATH=/login and
    # KC_HOSTNAME=https://shahin-ai.com/login.
    location ^~ /login/ {
        proxy_pass http://keycloak_origin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout    60s;
        proxy_connect_timeout  5s;
        proxy_send_timeout    30s;
        proxy_buffering       off;
    }

    # Block legacy KC paths from the old auth.* topology.
    location ~ ^/(realms|resources|protocol|js/keycloak) {
        return 404;
    }

    # Phase M1.6 — /login, /register, /forgot-password, /mfa,
    # /reset-password are now SPA-owned (Carbon Auth Pages Pack). The
    # SPA's <app-auth-page-host> renders the Carbon login/register card
    # and forwards submit/SSO events to /api/auth/oidc/start, so the
    # legacy edge 302 here is intentionally removed. Requests fall
    # through to `location /` -> product_shell which serves the SPA shell.

    # Phase M1.6 — explicit exact-match for SPA-owned auth pages so they
    # don't get the trailing-slash 301 from nginx's auto-redirect against
    # the Keycloak `/login/` prefix block above.
    location = /login            { proxy_pass http://product_shell; include /etc/nginx/snippets/proxy-common.conf; }
    location = /register         { proxy_pass http://product_shell; include /etc/nginx/snippets/proxy-common.conf; }
    location = /forgot-password  { proxy_pass http://product_shell; include /etc/nginx/snippets/proxy-common.conf; }
    location = /mfa              { proxy_pass http://product_shell; include /etc/nginx/snippets/proxy-common.conf; }
    location = /reset-password   { proxy_pass http://product_shell; include /etc/nginx/snippets/proxy-common.conf; }

    # Auth endpoints — strict brute-force zone (with chatty exemptions).
    location = /api/auth/csrf            { limit_req zone=api_global  burst=60 nodelay; proxy_pass http://platform_gateway; include /etc/nginx/snippets/proxy-common.conf; }
    location = /api/auth/oidc/start      { limit_req zone=api_global  burst=60 nodelay; proxy_pass http://platform_gateway; include /etc/nginx/snippets/proxy-common.conf; }
    location = /api/auth/oidc/callback   { limit_req zone=api_global  burst=60 nodelay; proxy_pass http://platform_gateway; include /etc/nginx/snippets/proxy-common.conf; }
    location   /api/auth/                { limit_req zone=auth_strict burst=10 nodelay; proxy_pass http://platform_gateway; include /etc/nginx/snippets/proxy-common.conf; }

    # WebSocket upgrade — gateway authenticates via dos_access_token cookie.
    location /ws {
        proxy_pass http://platform_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout   10s;
        proxy_buffering        off;
    }

    # Self-hosted Langfuse — LLM observability UI for platform admins.
    # Built with Next.js basePath=/admin/langfuse so paths already include
    # the prefix; gateway forwards as-is to 127.0.0.1:4090. Auth flows
    # through Keycloak (realm 'dogan', client 'langfuse'). One domain,
    # one token source.
    location /admin/langfuse/ {
        limit_req zone=api_global burst=60 nodelay;
        proxy_pass http://platform_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_buffering        off;
    }

    # PM2 Fleet Dashboard — admin-service mounts an HTML+JSON board at
    # /admin/pm2/ behind HTTP Basic auth (PM2_DASHBOARD_USER/PASS). gateway
    # forwards /admin/pm2/* to admin-service:4080 unauthenticated (Basic auth
    # is the gate). Reachable during KC/DAuth outages — that's the point.
    location /admin/pm2/ {
        limit_req zone=api_global burst=60 nodelay;
        proxy_pass http://platform_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_buffering        off;
    }

    # /admin/ root currently has no UI behind it (admin-service only mounts
    # /admin/pm2 + /api/admin). Send operators to the PM2 fleet board as the
    # default landing. Sibling pages /admin/langfuse/ and /admin/pm2/ have
    # their own location blocks above.
    location = /admin  { return 302 https://$host/admin/pm2/; }
    location = /admin/ { return 302 https://$host/admin/pm2/; }

    # Public landing-data stubs. The FE (grc-operations.service +
    # landing-api.service) calls /api/public/{agents,landing-content,stats}
    # with retry(2) + catchError({}); the original backend
    # (platform/Shahin-AI Website/backend/public-content.routes) was removed
    # during the platform reorg, leaving 404+retry noise on every page load.
    # Return empty 200s so the FE goes straight to its empty-state fallbacks.
    # Real agent list lives at /api/copilot/public-agents (already wired).
    location = /api/public/agents          { default_type application/json; return 200 '{"agents":[]}'; }
    location = /api/public/landing-content { default_type application/json; return 200 '{}'; }
    location = /api/public/stats           { default_type application/json; return 200 '{}'; }

    # Platform Admin Workspace — /admin/* SPA pages (whoami, dashboards,
    # fleet links). Falls through to gateway → admin-service:4080.
    location /admin/ {
        limit_req zone=api_global burst=60 nodelay;
        proxy_pass http://platform_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_buffering        off;
    }

    # Generic API.
    location /api/ {
        limit_req zone=api_global burst=60 nodelay;
        proxy_pass http://platform_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_buffering        off;
    }

    # SPA + everything else.
    location / {
        limit_req zone=static_zone burst=100 nodelay;
        proxy_pass http://product_shell;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout    300s;
        proxy_connect_timeout   3s;
        proxy_send_timeout     60s;
        proxy_buffering        off;
        proxy_next_upstream         error timeout http_502;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries   2;
    }
}

# ── Catch-all (monitoring only — no SPA, no auth) ──
server {
    listen 80 default_server;
    server_name _;
    location = /health       { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /ready        { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /nginx_status { stub_status; allow 127.0.0.1; deny all; }
    location /                { return 444; }
}
