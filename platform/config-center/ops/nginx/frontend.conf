# DOS Platform — Shahin-AI marketing site (TLS server block).
#
# Static SPA served from:
#   /opt/dos-aio/DOS Platform/products/shahin-ai/website/dist/shahin-ai/browser
#
# /api/* is proxied to the platform gateway. Same-domain /login is handled
# by ops/nginx/dos-platform.conf (Keycloak under shahin-ai.com/login).
#
# Note (Phase 4A, 2026-04-29): legacy path "Shahin-AI Website/spa" was renamed
# to "products/shahin-ai/website" via history-preserving git mv.

server {
    listen 80;
    server_name shahin-ai.com www.shahin-ai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shahin-ai.com www.shahin-ai.com;

    ssl_certificate     /etc/nginx/ssl/shahin_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/shahin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # CSP allows: self, Cloudflare beacon, Google Fonts. connect-src must list
    # every host the SPA may talk to (apex + www + wss for realtime).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://shahin-ai.com https://www.shahin-ai.com wss://shahin-ai.com wss://www.shahin-ai.com;" always;

    limit_req_zone $binary_remote_addr zone=spa_zone:10m rate=30r/s;
    client_body_timeout   12s;
    client_header_timeout 12s;
    client_max_body_size  50M;

    root  "/opt/dos-aio/DOS Platform/products/shahin-ai/website/dist/shahin-ai/browser";
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache hashed Angular bundles aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        limit_req zone=spa_zone burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # API → gateway via product-shell (which adds CSRF + tenant context).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout  15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
