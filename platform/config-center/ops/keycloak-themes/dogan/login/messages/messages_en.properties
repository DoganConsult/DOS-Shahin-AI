# Dogan English overrides for the Keycloak login theme.
# Only entries that need brand wording are overridden; everything else
# falls through to the parent keycloak theme.
#
# Brand wording is parameterised via ${brandName} so the same theme
# serves shahin-ai, tuwaiq-ai, and any other product realm by setting
# the realm's localized "brandName" message override in Admin → Realm
# Settings → Localization → Realm overrides.

loginTitle=Sign in to {0}
loginTitleHtml=Sign in to <strong>{0}</strong>
loginAccountTitle=Sign in to your account

doLogIn=Sign in
doRegister=Create an account
doForgotPassword=Forgot your password?

registerTitle=Create your {0} account
registerTitleHtml=Create your <strong>{0}</strong> account

# Default brand — realm overrides at runtime (per-product).
brandName=Shahin

# Required-action and error wording
emailVerifyTitle=Verify your email
emailVerifyInstruction1=A verification link has been sent to your email.
errorTitle=Something went wrong
errorTitleHtml=Something <strong>went wrong</strong>
backToLogin=« Back to sign in

# Footer / legal
termsLinkText=Terms of service
privacyLinkText=Privacy policy
poweredByText=Secured by Dogan-AI

# Locale switcher (used by dogan template.ftl for a11y label).
localeLabel=Language

# Sign-in helper copy — overrides the parent theme's generic prompts so
# new users land on the register flow via a branded CTA.
noAccount=New user?
doRegisterShort=Create account
haveAccount=Already have an account?

# Password requirement hint shown above new-password fields (optional —
# Keycloak only uses it if the realm password policy references it).
passwordHint=Use at least 8 characters with a mix of letters, numbers, and symbols.

# Info / error page CTA — used when there's no client context to return to.
continueToShahin=Continue

# ── User-profile attribute labels (referenced by dogan-user-profile.json) ──
# Built-in attributes (firstName, lastName, email, password, password-confirm)
# already have parent translations — only overrides for our custom set.
company=Company
country=Country
phone=Phone

# User-profile group: organisation details. Header + description show
# above the company/country/phone fields on the registration form.
organisation-details=Organisation details
organisation-details-description=Used to provision your tenant on first login.

# Required-fields hint at top of the registration form.
requiredFields=Required fields
