parent=keycloak
import=common/keycloak

# Stylesheets — loaded in declared order. Do NOT prefix `resources/`;
# Keycloak prepends it automatically (documented gotcha in
# feedback_keycloak_native_gotchas.md).
styles=css/login.css css/shahin.css

# Progressive-enhancement JS (password strength meter, email typo hint,
# show/hide password, submit loading state). Keycloak remains the source
# of truth for validation; this is UX polish only.
scripts=js/shahin.js

# Supported display languages. Order matches the realm's defaultLocale
# (en) so the language switcher and locale negotiation agree. Arabic is
# fully supported; the template still flips to RTL via locale.rtl when
# the user picks `ar`.
locales=en,ar

kcLogoLink=https://shahin-ai.com
kcLogoIdP-dogan=fa fa-shield-halved

# Shahin brand identity.
brandName=Shahin
brandTitle=Shahin-AI
brandTagline=AI-powered governance, risk & compliance
brandLogo=img/shahin-falcon.png
brandFavicon=img/favicon.svg

# Marketing / legal links (consumed by template footer).
brandHomeUrl=https://shahin-ai.com
brandTermsUrl=https://shahin-ai.com/legal/terms
brandPrivacyUrl=https://shahin-ai.com/legal/privacy

# Layout
displayInfo=true
displayWide=false

# Override the default Keycloak login template variables that the parent
# theme reads when rendering the page chrome. The additional `shahin`
# class hook is what all branded CSS selectors key off.
properties.kcHtmlClass=login-pf shahin
properties.kcLoginClass=login-pf-page shahin
properties.kcContentWrapperClass=login-pf-page-content shahin
properties.kcFormCardClass=card-pf shahin-card
properties.kcFormHeaderClass=login-pf-header shahin-header
properties.kcFormSocialAccountListClass=login-pf-social list-unstyled login-pf-social-section
