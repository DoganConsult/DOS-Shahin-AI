# Empirically derived module → table-prefix rules.
# Generated by inspecting modules/*/source/backend/*/migrations/ CREATE TABLE names.
# Primary prefix is the dominant; explicit lists handle overlap cases.
# Used by: ops/normalization/scripts/classify-by-prefix.ts
#
# Policy:
# - If ALL CREATE/ALTER tables in a file match a single module's primary prefix
#   (or are in that module's explicit list), owner = that module.
# - If file is under modules/{X}/... the path wins regardless of table prefix.
# - If any table has schema in {dos} and no other candidate, owner = platform-core.
# - Mixed prefixes across modules → classification.json marks as conflict.
#
# platform-core is a NEW module that will absorb every table in the dos.* public
# schema (~308 per catalog) plus the cross-module shared tables:
#   audit_trail, teams, workflows (referenced by 30+, 20+, 15+ modules respectively).

modules:
  - name: action
    primary: [action]
  - name: agrc-engine
    primary: [agrc]
  - name: ai
    primary: [ai]
    explicit_exclude: [ai_governance]  # owned by ai-governance
  - name: ai-governance
    primary: [agent, copilot]
    explicit_prefix: [ai_governance, governance_ai, agent_sod, agent_tool, agent_credentials]
    explicit: [ai_model_risk_register_link, autonomous_engine_log]
  - name: analytics
    primary: [analytics]
  - name: asset
    primary: [asset, assets]
  - name: attestation
    primary: [attestation]
  - name: audit
    primary: [audit]
    explicit_exclude: [audit_trail]  # owned by platform-core (shared)
  - name: bcp
    primary: [bcp]
  - name: benchmarks
    primary: [benchmarks, benchmark]
  - name: compliance
    primary: [compliance, csa, crosswalk, sod]
    explicit: [assessments, maturity_assessments, obligations, scores, retired_entities, entities]
  - name: controls
    primary: [controls, control]
  - name: dashboard
    primary: [dashboard, dashboards]
  - name: dashboard-editor
    primary: []
    explicit_prefix: [dashboard_editor]
  - name: data
    primary: []   # stub? no catalog entries
  - name: dora
    primary: [dora]
  - name: evidence
    primary: [evidence]
    explicit: [evidences]
  - name: exception
    primary: [exception]
  - name: executive
    primary: [executive]
  - name: fitch
    primary: [fitch]
  - name: governance
    primary: [governance, board]
    explicit_exclude: [governance_ai, governance_os]
  - name: governance-ai
    primary: []
    explicit_prefix: [governance_ai]
  - name: governance-os
    primary: []
    explicit_prefix: [governance_os]
  - name: grc-query
    primary: [grc, query]
  - name: inbox
    primary: [inbox]
  - name: incident
    primary: [incident, incidents, near, pir]
    explicit: [vulnerability_findings_map, near_miss_reports, pir_sign_offs, findings]
  - name: integrations
    primary: [integrations]
  - name: issues
    primary: [issues]
  - name: journey
    primary: [journey]
  - name: knowledge
    primary: [knowledge]
    explicit_exclude: [local_knowledge]
  - name: ksa-regulatory
    primary: [ksa, regulatory, sector]
  - name: local-knowledge
    primary: []
    explicit_prefix: [local_knowledge]
  - name: mcp
    primary: [mcp]
  - name: mobile
    primary: [mobile]
  - name: notification
    primary: [notification, notifications]
  - name: onboarding
    primary: [onboarding]
    explicit: [answers, blockers, feedback, inferred_facts, form_conditional_rules, content_packs]
  - name: operating-cockpit
    primary: [operating]
  - name: packs
    primary: [packs]
  - name: platform-onboarding
    primary: []   # likely shares onboarding_* — triage in Phase B
  - name: playbooks
    primary: [playbooks]
  - name: policy
    primary: [policy, policies]
  - name: portals
    primary: [portals]
  - name: privacy
    primary: [privacy, pdpl]
  - name: proactive-leadership
    primary: [proactive]
  - name: qiyas
    primary: [qiyas]
  - name: records
    primary: [records]
  - name: remediation
    primary: [remediation]
    explicit: [remediations, recovery_actions]
  - name: reporting
    primary: [reporting, report]
  - name: risk
    primary: [risk, kri]
    explicit: [risks, vulnerabilities, unresolved_risks]
  - name: team
    primary: [team]
    explicit_exclude: [teams]  # platform-core
  - name: training
    primary: [training]
  - name: vendor
    primary: [vendor]
    explicit: [vendors]
  - name: widgets
    primary: [widgets]
  - name: workflow
    primary: [workflow]
    explicit_exclude: [workflows]  # platform-core

  - name: platform-core
    primary: [tenant, platform, provisioning, module, product, file, export, lookup, component, work, workspace, pack, tenants, users, dos, org, user, config, approval, lifecycle, sso, access, active, alert, authority, csrf, delegation, enforcement, event, feature, job, permission, refresh, role, runtime, session, sign, slo, actor, api, authorization, authz, connector, contract, dead, decision, default, departments, email, enterprise, framework, frameworks, functional, iam, integration, invitations, jwt, login, navigation, password, pending, permissions, person, positions, processed, raci, realtime, register, reliability, roles, runbook, saved, scim, schema, secret, security, seed, sessions, shell, stage, startup, subscriptions, system, templates, tier, token, translations, ui, workspaces, as, autonomous]
    explicit_prefix: [tenant_membership, tenant_module, tenant_entitlement, platform_outbox, provisioning_jobs, provisioning_steps, provisioning_events, module_config, product_packs, pack_modules, file_storage, export_jobs, lookup_tables, component_registry, work_items, workspace_config]
    explicit: [audit_trail, teams, workflows, users, tenants, tenant_memberships, recommendations, actors, briefings, delegations, conditional_access_policies, plan_item_instances, sla_config]
    # Phase D expansion: every dos.* public-schema table (~308) routes here.
    # Primary prefix list above absorbs all platform infra: auth/access/session/
    # config/events/lookup/tenancy/provisioning/SLO/SSO/tokens/permissions. The
    # classifier also routes file-with-schema=dos-only to platform-core as Rule 3.

tiebreakers:
  # When multiple modules claim the same prefix, explicit_prefix (compound) wins
  # over primary (single-word). E.g. governance_ai_* -> governance-ai, not governance.
  explicit_prefix_first: true
  # When file path is under modules/{X}, that overrides any prefix rule.
  path_wins: true

# File-level overrides — highest precedence of all.
# Use when a file is single-owner but its table contents would mis-classify
# (e.g. platform-level rename operations that touch many module tables, or
# drift-repair migrations targeting dos.* which is platform-core).
# Special owner "SPLIT" marks files that genuinely require per-module splitting.
# Special owner "EXCLUDE" removes the file from classification (snapshots, etc.)
file_overrides:
  # Platform-level operations touching multiple tables but owned by platform-core
  ops/migrations/000_create_dos_schema.sql: platform-core
  ops/migrations/003a_enterprise_features.sql: platform-core
  ops/migrations/003b_platform_admin_tables.sql: platform-core
  ops/migrations/004_dos_dauth_platform_layer.sql: platform-core
  ops/migrations/005_missing_platform_tables.sql: platform-core
  ops/migrations/009b_service_domain_tables.sql: platform-core
  ops/migrations/018_create_lookup_tables.sql: platform-core
  ops/migrations/029_hardening_infrastructure.sql: platform-core
  ops/migrations/200_layer_conflict_closure.sql: platform-core
  ops/migrations/201_hybrid_layer_conflict_renames.sql: platform-core
  ops/migrations/20260418_0011_service_domain_schema_align.sql: platform-core
  ops/migrations/20260418_0011_service_domain_schema_align_down.sql: platform-core
  ops/migrations/tenant/037_platform_runtime_tables.sql: platform-core
  # Domain-specific single-owner files
  ops/migrations/016_onboarding_module_tables.sql: onboarding
  ops/migrations/033_question_bank_constraints_and_answers.sql: onboarding
  ops/migrations/tenant/125_ai_dynamic_tables.sql: ai-governance
  # Genuinely multi-owner files requiring per-module splitting (Phase B.5 splitter)
  ops/migrations/tenant/027_tenant_schema_tables.sql: SPLIT
  ops/migrations/tenant/000_inline_baseline.sql: SPLIT
  ops/migrations/tenant/118_incident_vendor_bcp_config_tables.sql: SPLIT
  ops/migrations/tenant/099_bootstrap_tenant_domain_tables.sql: SPLIT
  # Combo services whose migrations own tables for two modules by design
  ops/migrations/20260419_0002_p95_notifications_schema_align.sql: SPLIT
  # _down pairs of SPLIT sources co-locate with the source in _frozen
  ops/migrations/20260419_0002_p95_notifications_schema_align_down.sql: SPLIT
  ops/migrations/tenant/099_bootstrap_tenant_domain_tables_down.sql: SPLIT
  services/audit-service/migrations/001_audit_tables.sql: SPLIT
  services/compliance-controls-service/migrations/001_compliance_tables.sql: SPLIT
  services/evidence-audit-reporting-service/migrations/001_evidence_tables.sql: SPLIT
  services/remediation-action-service/migrations/001_remediation_tables.sql: SPLIT
  services/risk-incident-service/migrations/001_risk_incident_tables.sql: SPLIT
  services/workflow-service/migrations/001_workflow_tables.sql: SPLIT
  # Reference snapshots (not applied migrations)
  ops/migrations/expected-schema.sql: EXCLUDE
