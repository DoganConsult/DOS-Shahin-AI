# ═══════════════════════════════════════════════════════════════
# DOS Platform — PostgreSQL WAL Archiving Configuration
# ═══════════════════════════════════════════════════════════════
#
# Include this file in postgresql.conf:
#   include_dir = '/root/DOS-AIO/ops/postgresql'
#
# Or add to postgresql.conf:
#   include = '/root/DOS-AIO/ops/postgresql/wal-archiving.conf'
#
# After applying, restart PostgreSQL:
#   sudo systemctl restart postgresql
#
# Prerequisites:
#   mkdir -p /var/backups/dos-platform/wal
#   chown postgres:postgres /var/backups/dos-platform/wal
# ═══════════════════════════════════════════════════════════════

# Enable WAL archiving for point-in-time recovery
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/backups/dos-platform/wal/%f && cp %p /var/backups/dos-platform/wal/%f'
archive_timeout = 300

# Recommended: keep enough WAL for streaming replication failover
max_wal_senders = 3
wal_keep_size = 1GB
