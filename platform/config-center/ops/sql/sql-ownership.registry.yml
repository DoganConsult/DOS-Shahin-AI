# ─── Convention: tenant placeholder policy (added 2026-04-30) ──────────
conventions:
  tenantMigrations:
    placeholderPolicy: forbidden_in_new_files
    rationale: |
      The tenant migration runner (packages/dos-db/src/tenant-migrations.ts)
      prepends `SET search_path TO "<tenant_schema>", public;` before every
      migration. New files MUST use unqualified identifiers; the legacy
      `__TENANT_SCHEMA__` placeholder remains valid only in already-applied
      grandfathered files (changing one would invalidate every tenant's
      checksum and force 2900+ re-runs).
    enforcement: scripts/ci-guards/lint-no-tenant-placeholder.mjs
    grandfathered:
      - "modules/*/db/tenant/migrations/0*.sql"
      - "modules/*/db/migrations/0*.sql"
      - "ops/migrations/tenant/*.sql"
      - "*Module/db/tenant/migrations/*.sql"
    runnerGuard:
      file: packages/dos-db/src/tenant-migrations.ts
      symbol: PLACEHOLDER_NOT_SUBSTITUTED
      behavior: throws if substituted SQL still contains __TENANT_SCHEMA__
