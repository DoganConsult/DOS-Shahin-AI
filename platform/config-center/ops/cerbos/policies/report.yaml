---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "1"
  resource: "report"
  importDerivedRoles:
    - dogan_common

  rules:
    - actions: ["report.view", "report.list"]
      effect: EFFECT_ALLOW
      derivedRoles: ["tenant_member", "auditor_readonly", "platform_admin"]

    - actions: ["report.create", "report.update", "report.publish"]
      effect: EFFECT_ALLOW
      roles: ["report_editor", "report_admin", "tenant_admin", "platform_admin"]
      condition:
        match:
          expr: request.principal.attr.tenantId == request.resource.attr.tenantId

    # Export only after approval + dual approval obligation
    - actions: ["report.export"]
      effect: EFFECT_ALLOW
      roles: ["report_admin", "tenant_admin", "platform_admin"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.status == "approved"
              - expr: request.principal.attr.emailVerified == true
      output:
        expr: |
          { "requireDualApproval": true,
            "retainForDays": 3650 }
