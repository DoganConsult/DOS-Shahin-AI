<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Workspace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes, maximum-scale=5">
  <!-- CSP is enforced via Helmet HTTP header in production (server-middleware.ts). -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- iOS PWA / Capacitor -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workspace">
  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f4c81">
  <meta name="description" content="Workspace.">
  <meta property="og:title" content="Workspace">
  <meta property="og:description" content="The only platform that builds your entire KSA GRC workspace from simple questions.">
  <meta property="og:image" content="/assets/icons/icon-192x192.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Arabic and Latin fonts are bundled locally via @fontsource in angular.json. -->
</head>
<body>
  <!--
    Dynamic-UI doctrine: NO splash overlay, NO inline brand assets, NO
    legacy <script src="splash-init.js"> / <script src="cf-fix.js">.
    Brand/loading state ships from /api/ui-os/workspace-runtime → chrome
    via WorkspaceShellBindingService and the marketing-landing template.
    The shell host renders nothing until UI-OS resolves.
  -->
  <app-root></app-root>
</body>
</html>
