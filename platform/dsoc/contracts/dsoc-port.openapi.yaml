openapi: 3.1.0
info:
  title: DSOC Port — Public REST Contract
  version: 1.0.0
  description: |
    Canonical wire contract for `DSOCPort` from `@dos/ports/dsoc`.
    1:1 HTTP endpoints for the in-process port. Versioned via `/v1`.
    Increment to `/v2` only on a MAJOR `@dos/ports` bump.

servers:
  - url: '{baseUrl}/api/dsoc/port/v1'
    variables:
      baseUrl:
        default: 'http://localhost:4002'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DSOCAuditEvent:
      type: object
      required: [tenantId, category, severity, actor, action, outcome, occurredAt]
      properties:
        tenantId: { type: string }
        category:
          type: string
          enum: [authn, authz, session, mfa, sod, delegation, config_change, data_access, threat, posture]
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [user, service, agent] }
            id: { type: string }
        action: { type: string }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        occurredAt: { type: string, format: date-time }
        attributes:
          type: object
          additionalProperties: true
        correlationId: { type: string }

    DSOCPostureSnapshot:
      type: object
      required: [tenantId, capturedAt, score, findings]
      properties:
        tenantId: { type: string }
        capturedAt: { type: string, format: date-time }
        score:
          type: integer
          minimum: 0
          maximum: 100
        findings:
          type: array
          items:
            type: object
            required: [code, severity, summary]
            properties:
              code: { type: string }
              severity:
                type: string
                enum: [info, low, medium, high, critical]
              summary: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

paths:
  /audit-events:
    post:
      operationId: recordAuditEvent
      summary: 'DSOCPort.recordAuditEvent(event)'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DSOCAuditEvent' }
      responses:
        '202':
          description: Audit event accepted (non-blocking)
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean }
    get:
      operationId: listAuditEvents
      summary: Recent audit events for a tenant.
      parameters:
        - in: query
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, count, events]
                properties:
                  tenantId: { type: string }
                  count: { type: integer }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/DSOCAuditEvent' }

  /alerts:
    post:
      operationId: raiseAlert
      summary: 'DSOCPort.raiseAlert(event)'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DSOCAuditEvent' }
      responses:
        '202':
          description: Alert raised
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean }
    get:
      operationId: listOpenAlerts
      summary: Open alerts for a tenant.
      parameters:
        - in: query
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, count, alerts]
                properties:
                  tenantId: { type: string }
                  count: { type: integer }
                  alerts:
                    type: array
                    items:
                      type: object
                      required: [id, severity, category, action, status, createdAt]
                      properties:
                        id: { type: integer }
                        severity: { type: string }
                        category: { type: string }
                        action: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }

  /alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      summary: Move an open alert to acknowledged.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by]
              properties:
                by: { type: string }
      responses:
        '200':
          description: Ack result
          content:
            application/json:
              schema:
                type: object
                required: [id, acknowledged]
                properties:
                  id: { type: integer }
                  acknowledged: { type: boolean }

  /alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      summary: Resolve an alert.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by]
              properties:
                by: { type: string }
      responses:
        '200':
          description: Resolve result
          content:
            application/json:
              schema:
                type: object
                required: [id, resolved]
                properties:
                  id: { type: integer }
                  resolved: { type: boolean }

  /correlations/{correlationId}:
    get:
      operationId: listByCorrelation
      summary: All audit events sharing a correlation id (ordered ASC).
      parameters:
        - in: path
          name: correlationId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Correlated events
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, count, events]
                properties:
                  correlationId: { type: string }
                  count: { type: integer }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/DSOCAuditEvent' }

  /posture/{tenantId}:
    get:
      operationId: getLatestPosture
      summary: 'DSOCPort.getLatestPosture(tenantId)'
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Latest posture snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DSOCPostureSnapshot' }
        '404':
          description: No snapshot recorded for this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
